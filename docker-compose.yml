services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: credentialsvc
      POSTGRES_PASSWORD: credentialsvc
      POSTGRES_DB: credentialsvc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credentialsvc -d credentialsvc"]
      interval: 5s
      timeout: 5s
      retries: 5

  issuer:
    build:
      context: .
      dockerfile: build/issuer.Dockerfile
    environment:
      ISSUER_HTTP_PORT: 8080
      DEFAULT_TENANT_ID: default-tenant
      ISSUER_LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on: []

  verifier:
    build:
      context: .
      dockerfile: build/verifier.Dockerfile
    environment:
      VERIFIER_HTTP_PORT: 8081
      DEFAULT_TENANT_ID: default-tenant
      VERIFIER_LOG_LEVEL: info
      VERIFIER_DB_DSN: postgres://credentialsvc:credentialsvc@postgres:5432/credentialsvc?sslmode=disable
      VERIFIER_USE_DB_TRUST_REGISTRY: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  s2s-api:
    build:
      context: .
      dockerfile: build/samples_api.Dockerfile
    environment:
      API_HTTP_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - verifier

  s2s-client:
    build:
      context: .
      dockerfile: build/samples_client.Dockerfile
    environment:
      ISSUER_BASE_URL: http://issuer:8080
      GATEWAY_AUTHORIZE_URL: http://verifier:8081
      API_BASE_URL: http://s2s-api:8082
    depends_on:
      - issuer
      - verifier
      - s2s-api

volumes:
  pgdata:
