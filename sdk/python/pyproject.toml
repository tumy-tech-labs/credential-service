[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-service-sdk"
version = "0.1.0"
description = "Python SDK for the Credential Service - issue, verify, and authorize W3C Verifiable Credentials"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Credential Service Contributors"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["verifiable-credentials", "did", "w3c", "jwt", "sd-jwt", "authentication", "authorization"]

dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24.0"]
requests = ["requests>=2.28.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/bradtumy/credential-service"
Documentation = "https://github.com/bradtumy/credential-service/tree/main/docs"
Repository = "https://github.com/bradtumy/credential-service"
Issues = "https://github.com/bradtumy/credential-service/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["credential_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
