---
apiVersion: v1
kind: ConfigMap
metadata:
  name: issuer-config
  namespace: credential-service
data:
  ISSUER_HTTP_PORT: "8080"
  DEFAULT_TENANT_ID: "default-tenant"
  ISSUER_LOG_LEVEL: "info"
  TENANCY_MODE: "single"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-issuer
  namespace: credential-service
  labels:
    app: credential-issuer
    component: issuer
spec:
  replicas: 3  # Scale issuer independently
  selector:
    matchLabels:
      app: credential-issuer
  template:
    metadata:
      labels:
        app: credential-issuer
        component: issuer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: issuer
        image: ghcr.io/bradtumy/credential-issuer:latest  # Build and push your image
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: issuer-config
        env:
        - name: USE_PRODUCTION_KEYSTORE
          value: "false"  # Set to "true" for KMS in production
        # Uncomment for production KMS
        # - name: GCP_KMS_KEY_NAME
        #   valueFrom:
        #     secretKeyRef:
        #       name: issuer-secrets
        #       key: kms-key-name
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: credential-issuer
  namespace: credential-service
  labels:
    app: credential-issuer
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: credential-issuer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credential-issuer-hpa
  namespace: credential-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credential-issuer
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
