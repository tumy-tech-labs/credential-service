---
apiVersion: v1
kind: ConfigMap
metadata:
  name: verifier-config
  namespace: credential-service
data:
  VERIFIER_HTTP_PORT: "8081"
  DEFAULT_TENANT_ID: "default-tenant"
  VERIFIER_LOG_LEVEL: "info"
  VERIFIER_USE_DB_TRUST_REGISTRY: "true"
  TENANCY_MODE: "single"
  GATEWAY_CACHE: "false"  # Enable with Redis
  RATE_LIMIT_ENABLED: "false"  # Enable with Redis

---
apiVersion: v1
kind: Secret
metadata:
  name: verifier-secret
  namespace: credential-service
type: Opaque
stringData:
  VERIFIER_DB_DSN: "postgres://credentialsvc:credentialsvc@postgres:5432/credentialsvc?sslmode=disable"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-verifier
  namespace: credential-service
  labels:
    app: credential-verifier
    component: verifier
spec:
  replicas: 5  # Scale verifier independently (typically more than issuer)
  selector:
    matchLabels:
      app: credential-verifier
  template:
    metadata:
      labels:
        app: credential-verifier
        component: verifier
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: verifier
        image: ghcr.io/bradtumy/credential-verifier:latest  # Build and push your image
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: verifier-config
        - secretRef:
            name: verifier-secret
        env:
        - name: USE_PRODUCTION_KEYSTORE
          value: "false"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: credential-verifier
  namespace: credential-service
  labels:
    app: credential-verifier
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: credential-verifier

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credential-verifier-hpa
  namespace: credential-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credential-verifier
  minReplicas: 5
  maxReplicas: 50  # Verifier typically needs more capacity
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 5
        periodSeconds: 15
      selectPolicy: Max
