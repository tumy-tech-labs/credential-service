---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: credential-service
data:
  POSTGRES_DB: credentialsvc
  POSTGRES_USER: credentialsvc

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: credential-service
type: Opaque
stringData:
  POSTGRES_PASSWORD: credentialsvc  # Change in production!

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: credential-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: credential-service
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - credentialsvc
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - credentialsvc
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-init-scripts

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: credential-service
data:
  init.sql: |
    -- Trust Registry
    CREATE TABLE IF NOT EXISTS trusted_issuers (
        id SERIAL PRIMARY KEY,
        tenant_id VARCHAR(255) NOT NULL DEFAULT 'default-tenant',
        issuer_did TEXT NOT NULL,
        added_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(tenant_id, issuer_did)
    );

    CREATE INDEX IF NOT EXISTS idx_trusted_issuers_tenant ON trusted_issuers(tenant_id);

    -- Tenants
    CREATE TABLE IF NOT EXISTS tenants (
        id VARCHAR(255) PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        enabled BOOLEAN DEFAULT true,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Policies
    CREATE TABLE IF NOT EXISTS policies (
        id SERIAL PRIMARY KEY,
        tenant_id VARCHAR(255) NOT NULL DEFAULT 'default-tenant',
        name VARCHAR(255) NOT NULL,
        description TEXT,
        effect VARCHAR(10) NOT NULL CHECK (effect IN ('allow', 'deny')),
        actions TEXT[] NOT NULL,
        resources TEXT[] NOT NULL,
        subjects TEXT[] NOT NULL,
        conditions JSONB,
        priority INTEGER DEFAULT 100,
        enabled BOOLEAN DEFAULT true,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(tenant_id, name)
    );

    CREATE INDEX IF NOT EXISTS idx_policies_tenant ON policies(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_policies_enabled ON policies(enabled);

    -- Audit Logs
    CREATE TABLE IF NOT EXISTS audit_events (
        id SERIAL PRIMARY KEY,
        timestamp TIMESTAMP NOT NULL,
        event_type VARCHAR(100) NOT NULL,
        tenant_id VARCHAR(255),
        user_id VARCHAR(255),
        subject_did TEXT,
        issuer_did TEXT,
        resource VARCHAR(255),
        action VARCHAR(100),
        outcome VARCHAR(50),
        reason TEXT,
        ip_address VARCHAR(45),
        user_agent TEXT,
        metadata JSONB,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_audit_events_timestamp ON audit_events(timestamp);
    CREATE INDEX IF NOT EXISTS idx_audit_events_tenant ON audit_events(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_audit_events_event_type ON audit_events(event_type);

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: credential-service
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres
